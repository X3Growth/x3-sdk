name: publish

# Publishes @x3growth/sdk to npm with provenance when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing (OIDC, no token): configured on npmjs.com for X3Growth/x3-sdk,
# workflow publish.yml, environment npm. Provenance is attached automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run pack
      - run: npm run smoke
      - run: npm publish ./.publish --access public
